apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/nodestich/product-management-system/web:feature-ci-cd
          # The tag is moved by every CI build, but the image is loaded into minikube by hand.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # nginx proxies /api, /scalar, /health and /openapi to the "api" service.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pms
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
