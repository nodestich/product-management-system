name: CI

on:
  push:
    branches: [feature/ci-cd] # move to master once the pipeline is trusted
    # Documentation-only pushes cannot change a job outcome. Pull requests are never filtered.
    paths-ignore:
      - '**.md'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: pms-ci:${{ github.sha }}

jobs:
  # Decides which side changed, so the other side's jobs can be skipped.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Everything that can change the backend build, the tests or the analysis.
      backend: ${{ steps.diff.outputs.backend }}
      # The inputs of the published API image (wider on .dockerignore, narrower on test tooling).
      api: ${{ steps.diff.outputs.api }}
      # The inputs of the published web image.
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff base must exist locally

      - name: Diff against the base of this change
        id: diff
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          # A new branch, a force push or a base outside the clone has no usable parent commit.
          git cat-file -e "${base}^{commit}" 2>/dev/null || base=$(git rev-list --max-parents=0 HEAD | tail -1)
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          flag() {
            if grep -Eq "$2" <<<"$files"; then value=true; else value=false; fi
            echo "$1=$value" >> "$GITHUB_OUTPUT"
          }
          flag backend '^(backend/|global\.json$|Directory\.Build\.props$|\.editorconfig$|Dockerfile\.ci$|scripts/)'
          flag api     '^(backend/|global\.json$|Directory\.Build\.props$|\.dockerignore$)'
          flag web     '^frontend/'

  # Everything runs inside an image built from this commit, never on runner-provided toolchains.
  test-api:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the CI image
        run: docker build -f Dockerfile.ci -t "$CI_IMAGE" .

      - name: Build and test inside the image
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -e TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/backend/TestResults:/src/backend/TestResults" \
            "$CI_IMAGE" -c '
              dotnet build ProductManagement.sln --configuration Release --no-restore &&
              dotnet test ProductManagement.sln --configuration Release --no-build \
                --collect:"XPlat Code Coverage" \
                --results-directory /src/backend/TestResults
            '

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/TestResults
          if-no-files-found: warn

  # The frontend suite needs no browser (vitest + jsdom), so the official Node image is enough.
  test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the unit tests
        run: |
          docker run --rm -e CI=true \
            -v "$PWD/frontend:/app" -w /app \
            node:22-alpine sh -c 'npm ci && npx ng test --watch=false'

  # Throwaway SonarQube: the token is generated at runtime, so no repository secret is needed.
  # The instance is destroyed afterwards, so there is no history and no pull-request decoration.
  sonar:
    needs: [changes, test-api] # a skipped test-api skips the analysis of unchanged backend code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # dhi.io requires authentication, which a fresh runner does not have. The public
      # upstream image is the same SonarQube version, so the analysis is equivalent.
      SONAR_IMAGE: sonarqube:26.10.0.133078-community
    steps:
      - uses: actions/checkout@v4

      - name: Raise vm.max_map_count for SonarQube's search engine
        run: sudo sysctl -w vm.max_map_count=524288

      - name: Start SonarQube
        run: docker compose --profile sonar up -d sonar-db sonar

      - name: Wait for SonarQube
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -fsS http://localhost:9000/api/system/status 2>/dev/null | jq -r .status || true)
            if [ "$status" = "UP" ]; then
              exit 0
            fi
            echo "status: ${status:-unreachable} ($attempt/60)"
            sleep 5
          done
          echo "SonarQube never became reachable" >&2
          docker compose --profile sonar logs sonar
          exit 1

      - name: Generate a token for this run
        run: |
          token=$(curl -fsS -u admin:admin -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=ci-${GITHUB_RUN_ID}" | jq -r .token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Could not generate a SonarQube token" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run the analysis
        run: docker compose --profile sonar run --rm sonar-scan

      - name: Stop SonarQube
        if: always()
        run: docker compose --profile sonar down -v

  # Release images: only a push publishes, and only the images whose inputs changed.
  publish:
    needs: [changes, test-api, test-web, sonar]
    # The test jobs are skipped for a one-sided change, so a plain needs gate would never be satisfied.
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/feature/ci-cd' &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A sha tag already in the registry means this commit was published by an earlier run.
      - name: Plan the release
        id: plan
        run: |
          short_sha="${GITHUB_SHA::7}"
          published() {
            docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY}/$1:sha-$short_sha" >/dev/null 2>&1
          }
          api='${{ needs.changes.outputs.api }}'
          web='${{ needs.changes.outputs.web }}'
          echo "api=$([ "$api" = true ] && ! published api && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ "$web" = true ] && ! published web && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build and push the API image
        if: steps.plan.outputs.api == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}/api"
          short_sha="${GITHUB_SHA::7}"
          docker build -f backend/src/ProductManagement.Api/Dockerfile \
            -t "$image:sha-$short_sha" -t "$image:feature-ci-cd" .
          docker push "$image:sha-$short_sha"
          docker push "$image:feature-ci-cd"

      - name: Build and push the web image
        if: steps.plan.outputs.web == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}/web"
          short_sha="${GITHUB_SHA::7}"
          docker build -t "$image:sha-$short_sha" -t "$image:feature-ci-cd" frontend
          docker push "$image:sha-$short_sha"
          docker push "$image:feature-ci-cd"
