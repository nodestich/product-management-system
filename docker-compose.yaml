name: product-management-system

x-api: &api
  build:
    context: .
    dockerfile: backend/src/ProductManagement.Api/Dockerfile
  image: pms-api:local
  environment: &api-env
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__Default: "Host=postgres;Port=5432;Database=productmanagement;Username=postgres;Password=postgres"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productmanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productmanagement"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api
    command: ["--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # Static analysis stack. Opt-in: docker compose --profile sonar up -d
  sonar-db:
    profiles: [sonar]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonar:
    profiles: [sonar]
    # Defaults to the Docker Hardened Image (pinned by digest). That registry needs
    # `docker login dhi.io`, so CI overrides SONAR_IMAGE with the public upstream image.
    image: ${SONAR_IMAGE:-dhi.io/sonarqube:26-debian-dev@sha256:eeb004c6b9160a26b94e0d31ac48919ad7da5401c9b185b02380242dc8355dd5}
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    ports:
      - "9000:9000"
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-logs:/opt/sonarqube/logs
      - sonar-extensions:/opt/sonarqube/extensions

  # docker compose --profile sonar run --rm sonar-scan
  sonar-scan:
    profiles: [sonar]
    build:
      context: .
      dockerfile: Dockerfile.ci
    command: ["/src/scripts/analyze-sonar.sh"]
    environment:
      SONAR_HOST_URL: http://sonar:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The integration tests start their own throwaway container, so a daemon is needed.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/TestResults:/src/backend/TestResults
      - sonar-scanner-cache:/root/.sonar/cache
      - ./.git:/src/.git:ro
    depends_on:
      - sonar
    restart: "no"

volumes:
  postgres-data:
  sonar-db-data:
  sonar-data:
  sonar-logs:
  sonar-extensions:
  sonar-scanner-cache: