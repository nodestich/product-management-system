{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pms.fullname" . }}-db
  labels:
    {{- include "pms.labels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  ConnectionStrings__Default: {{ include "pms.connectionString" . | quote }}
{{- end }}
