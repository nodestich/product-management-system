apiVersion: v1
kind: Service
metadata:
  # Fixed name: the web image's nginx proxies /api to http://api:8080.
  name: {{ .Values.api.service.name }}
  labels:
    {{- include "pms.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "pms.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
