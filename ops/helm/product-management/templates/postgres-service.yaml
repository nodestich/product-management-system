apiVersion: v1
kind: Service
metadata:
  name: {{ include "pms.postgresHost" . }}
  labels:
    {{- include "pms.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "pms.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
