apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.web.service.name }}
  labels:
    {{- include "pms.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  selector:
    {{- include "pms.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
